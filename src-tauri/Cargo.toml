[package]
name = "monitor"
version = "2.6.1030-2"
description = "Watch CPU, memory, disk, claude sessions and runners across computers"
authors = ["RUNNERS-IM"]
license-file = "../LICENSE.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.0"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
window-vibrancy = "0.8.1"
tauri-plugin-opener = "2.7.2"
sys-locale = "0.3.2"
libc = "0.2"
tauri-plugin-notification = "2.8.0"
# Why: draws the menu-bar bars picture at runtime, so the moving bars need no image files.
# Pinned to the same version as Remote so every RUNNERS app renders the shared frame with the same pixels.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
