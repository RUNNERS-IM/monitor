# master 를 release 브랜치로 합치면 배포 판을 낸다(태그 v<버전>). Split · Prompt 와 같은 방식:
# 1) 버전을 출시일 기준 2.{연도 끝자리}.{MMDD} 로 올려 release 에 커밋한다([skip ci]),
# 2) macOS(유니버설) · 윈도우 · 리눅스 판을 빌드해 GitHub Releases(태그 v<버전>)에 올린다.
# Homebrew 는 RUNNERS-IM/homebrew-tap 의 워크플로가 최신 릴리스를 보고 따라 고친다.
#
# macOS 는 Developer ID 로 서명 · 공증한다. 서명 키는 조직 비밀값에서 이 실행 동안만 쓰는
# 임시 키체인에 넣고 끝나면 지운다. 윈도우는 코드 서명 인증서가 없어 서명하지 않는다
# (처음 열 때 SmartScreen 경고가 뜬다).
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 빌드 · 서명 · 공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 빌드 시험에 쓴다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: "버전을 올리고 배포하기 (끄면 시험 실행)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || github.sha }}
      app_version: ${{ steps.bump.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && 'release' || github.ref }}
          fetch-depth: 0  # 태그로 같은 날 낸 버전이 있는지 본다

      - name: Bump the version and push
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BUMPED=$(scripts/bump-release.sh)
          VERSION=$(echo "$BUMPED" | sed -n 1p)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Monitor $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$(echo "$BUMPED" | sed -n 2p)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick the version of a test run
        id: current
        if: env.PUBLISH != 'true'
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)-test" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-26
            args: --target universal-apple-darwin
            bundles: src-tauri/target.noindex/universal-apple-darwin/release/bundle
          - os: windows
            runner: windows-latest
            args: ""
            bundles: src-tauri/target.noindex/release/bundle
          - os: linux
            runner: ubuntu-22.04  # 오래된 glibc 로 빌드해야 더 많은 배포판에서 켜진다
            args: ""
            bundles: src-tauri/target.noindex/release/bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target.noindex

      - name: Install the Linux system packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: pnpm install --frozen-lockfile

      # Split 과 같은 방식: 이 실행 동안만 쓰는 임시 키체인에 Developer ID 를 넣고, 끝나면 지운다.
      # Why: Tauri 의 APPLE_CERTIFICATE 가져오기는 첫 시험 실행에서 p12 를 읽지 못했고,
      # 이 방식은 Split 배포에서 같은 인증서로 돌고 있다.
      - name: Prepare a temporary signing keychain
        if: matrix.os == 'macos'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/monitor-secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          KEYCHAIN="$RUNNER_TEMP/monitor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The search list is put back as it was when the run ends.
          security list-keychains -d user | tr -d '" ' > "$SECRETS/keychains-before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$SECRETS/developer-id.p12"
          security import "$SECRETS/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SECRETS/keychains-before")
          rm "$SECRETS/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s' "$ASC_API_KEY_P8" > "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$SECRETS/"*
          echo "APPLE_API_KEY_PATH=$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      # macOS 에서는 tauri.conf.json 의 signingIdentity 로 위 키체인에서 서명하고,
      # APPLE_API_* 로 앱을 공증한다.
      - name: Build
        shell: bash
        env:
          APPLE_API_KEY: ${{ matrix.os == 'macos' && secrets.ASC_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.ASC_API_ISSUER_ID || '' }}
          # 자동 업데이트 파일(.sig)을 서명하는 열쇠. 비밀번호 없이 만들었다(Split 의 Sparkle 열쇠와 같은 방식).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build ${{ matrix.args }}

      # 앱은 Tauri 가 공증했지만 DMG 자체도 공증 · 스테이플해야 오프라인에서도 경고 없이 열린다
      - name: Notarize the DMG
        if: matrix.os == 'macos'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls ${{ matrix.bundles }}/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"

      # 파일 이름을 Split 과 같은 모양(Monitor-<버전>.dmg, monitor-<버전>-<OS>-<CPU>.<확장자>)으로 맞춘다
      - name: Collect the files
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist-release && mkdir -p $OUT
          B=${{ matrix.bundles }}
          case ${{ matrix.os }} in
            macos)
              cp $B/dmg/*.dmg "$OUT/Monitor-$VERSION.dmg"
              cp $B/macos/*.app.tar.gz "$OUT/Monitor-$VERSION.app.tar.gz"
              cp $B/macos/*.app.tar.gz.sig "$OUT/Monitor-$VERSION.app.tar.gz.sig" ;;
            windows)
              cp $B/nsis/*-setup.exe "$OUT/monitor-$VERSION-windows-x64-setup.exe"
              cp $B/nsis/*-setup.exe.sig "$OUT/monitor-$VERSION-windows-x64-setup.exe.sig"
              cp $B/msi/*.msi "$OUT/monitor-$VERSION-windows-x64.msi" ;;
            linux)
              cp $B/appimage/*.AppImage "$OUT/monitor-$VERSION-linux-x86_64.AppImage"
              cp $B/appimage/*.AppImage.sig "$OUT/monitor-$VERSION-linux-x86_64.AppImage.sig"
              cp $B/deb/*.deb "$OUT/monitor-$VERSION-linux-amd64.deb"
              cp $B/rpm/*.rpm "$OUT/monitor-$VERSION-linux-x86_64.rpm" ;;
          esac
          ls -la $OUT

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ matrix.os }}
          path: dist-release/*
          retention-days: 3

      - name: Remove the temporary keychain and keys
        if: always() && matrix.os == 'macos'
        run: |
          SECRETS="$RUNNER_TEMP/monitor-secrets"
          if [ -f "$SECRETS/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$SECRETS/keychains-before")
          fi
          security delete-keychain "$RUNNER_TEMP/monitor-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SECRETS"

  publish:
    needs: [version, build]
    if: needs.version.result == 'success' && github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # 설치된 Monitor 는 latest.json 의 버전을 semver 로 읽어 자기 버전과 비교한다. 그래서 태그 모양(2.6.1030.2)이
      # 아니라 앱 안에 넣은 모양(2.6.1030-2)을 적는다. 태그 모양은 semver 가 아니라 읽지 못한다.
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # 설치된 Monitor 가 releases/latest/download/latest.json 을 읽어 새 판을 찾는다(src-tauri/src/update.rs).
      # 맥은 universal 하나라 Apple silicon · Intel 이 같은 파일을 받는다.
      - name: Write latest.json for the updater
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          MAC="Monitor-$VERSION.app.tar.gz"
          WIN="monitor-$VERSION-windows-x64-setup.exe"
          LINUX="monitor-$VERSION-linux-x86_64.AppImage"
          jq -n --arg v "$APP_VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$BASE/$MAC" --rawfile macsig "files/$MAC.sig" \
            --arg win "$BASE/$WIN" --rawfile winsig "files/$WIN.sig" \
            --arg linux "$BASE/$LINUX" --rawfile linuxsig "files/$LINUX.sig" \
            '{version: $v, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $mac, signature: $macsig},
              "darwin-x86_64": {url: $mac, signature: $macsig},
              "windows-x86_64": {url: $win, signature: $winsig},
              "linux-x86_64": {url: $linux, signature: $linuxsig}}}' > files/latest.json
          cat files/latest.json | jq '.platforms | keys'

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Monitor $VERSION" \
            --notes "macOS (Apple silicon, Intel), Windows, Linux. The Windows installer is not code signed yet, so Windows shows a SmartScreen warning the first time."
