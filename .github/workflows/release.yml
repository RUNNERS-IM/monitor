# master 를 release 브랜치로 합치면 배포 판을 낸다(태그 v<버전>). Split · Prompt 와 같은 방식:
# 1) 버전을 출시일 기준 2.{연도 끝자리}.{MMDD} 로 올려 release 에 커밋한다([skip ci]),
# 2) 네이티브 모듈(native/, napi-rs)을 OS · CPU 마다 빌드하고 electron-builder 로 macOS(Apple silicon, Intel) ·
#    윈도우 · 리눅스 판을 만들어 GitHub Releases(태그 v<버전>)에 올린다. electron-updater 가 읽는
#    latest-mac.yml · latest.yml · latest-linux.yml 도 같이 올린다.
#
# 빌드 단계는 build.yml 에 있다. Mac 판은 GitHub Mac(macos-15)에서 먼저 만들고, 그 작업이 취소 · 실패하면
# 사무실 맥 스튜디오(m2-ultra-sun-1)가 같은 출시 안에서 이어서 만든다. publish 는 성공한 쪽 Mac 판을 올린다.
#
# macOS 는 Developer ID 로 서명 · 공증한다. 서명 키는 조직 비밀값에서 이 실행 동안만 쓰는
# 임시 키체인에 넣고 끝나면 지운다. 윈도우는 코드 서명 인증서가 없어 서명하지 않는다
# (처음 열 때 SmartScreen 경고가 뜬다).
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 빌드 · 서명 · 공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 빌드 시험에 쓴다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: '버전을 올리고 배포하기 (끄면 시험 실행)'
        type: boolean
        default: false
      skip_github_mac:
        description: 'GitHub Mac 작업을 건너뛰어 맥 스튜디오 대체 경로를 시험하기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || github.sha }}
      app_version: ${{ steps.bump.outputs.app_version || steps.current.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PUBLISH == 'true' && 'release' || github.ref }}
          fetch-depth: 0 # 태그로 같은 날 낸 버전이 있는지 본다

      - name: Bump the version and push
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BUMPED=$(scripts/bump-release.sh)
          VERSION=$(echo "$BUMPED" | sed -n 1p)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json native/Cargo.toml
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Monitor $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$(echo "$BUMPED" | sed -n 2p)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick the version of a test run
        id: current
        if: env.PUBLISH != 'true'
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "version=$(echo "$APP_VERSION" | tr + .)-test" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  # Windows · Linux 판. Mac 판은 아래 두 작업이 맡는다.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: '"windows-latest"'
            builder: --win
          - os: linux
            runner: '"ubuntu-22.04"' # 오래된 glibc 로 빌드해야 더 많은 배포판에서 켜진다
            builder: --linux
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      builder: ${{ matrix.builder }}
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  # Mac 판은 먼저 GitHub 의 Apple 칩 Mac(macos-15)에서 만든다. GitHub 호스팅 macos-26 은 Split 출시 때(2026-10-31)
  # 대기열에서 16분 만에 두 번 취소돼서 자리가 많은 macos-15 를 쓴다. 그래도 2026-11-12 새벽 Split 은 자리가 없어 네 번 취소됐다.
  build-mac:
    needs: version
    if: ${{ !inputs.skip_github_mac }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos
      runner: '"macos-15"'
      builder: --mac
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  # GitHub Mac 작업이 취소 · 실패하면(시험에서 건너뛰어도) 같은 출시 안에서 사무실 맥 스튜디오가 이어서 만든다
  # (2026-11-12 결정 「Mac 판은 GitHub 기계 먼저, 못 받으면 맥 스튜디오에서」). 서명 키체인은 끝나면 지우고,
  # 남아 있으면 이 작업을 실패로 끝낸다(build.yml 맨 끝 단계).
  build-mac-studio:
    needs: [version, build-mac]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build-mac.result != 'success' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos
      runner: '["self-hosted", "macOS", "ARM64", "m2-ultra-sun-1"]'
      builder: --mac
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  publish:
    needs: [version, build, build-mac, build-mac-studio]
    # 둘 중 성공한 Mac 판으로 올린다. 맥 스튜디오 작업은 GitHub Mac 이 성공하면 건너뛰어진다.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.build.result == 'success' &&
      (needs.build-mac.result == 'success' || needs.build-mac-studio.result == 'success') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Tauri 판은 latest.json 의 버전을 semver 로 읽어 자기 버전과 비교한다. 그래서 태그 모양(2.6.1030.2)이
      # 아니라 앱 안에 넣은 모양을 적는다(2026-11-05 부터는 둘이 같다: 2.6.110502).
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      # 다리: 이 사무실 맥 8대에는 Tauri 판(2.6.1030.2)이 깔려 있고, 그 판은
      # releases/latest/download/latest.json 을 읽어 minisign 서명(공개 키는 예전 src-tauri/tauri.conf.json)을
      # 확인한 뒤 새 판을 설치한다. 그래서 Electron 판도 같은 모양의 latest.json 으로 내놓는다:
      # 맥은 Electron Monitor.app 의 tar.gz, 윈도우는 NSIS 설치 파일, 리눅스는 AppImage 를 같은 열쇠
      # (TAURI_SIGNING_PRIVATE_KEY, 비밀번호 없음)로 서명한다.
      # Tauri 판이 하나도 남지 않으면(모두 Electron 판으로 넘어오면) 이 단계와 위의 tar.gz 단계를 지워도 된다.
      - name: Sign the bridge files for installed Tauri copies
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          for f in "files/Monitor-$VERSION-aarch64.app.tar.gz" "files/Monitor-$VERSION-x86_64.app.tar.gz" \
                   "files/monitor-$VERSION-windows-x64-setup.exe" "files/monitor-$VERSION-linux-x86_64.AppImage"; do
            npx --yes @tauri-apps/cli@2 signer sign --password "" "$f"
          done
          ls -la files/*.sig

      - name: Write latest.json for installed Tauri copies
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          ARM="Monitor-$VERSION-aarch64.app.tar.gz"
          INTEL="Monitor-$VERSION-x86_64.app.tar.gz"
          WIN="monitor-$VERSION-windows-x64-setup.exe"
          LINUX="monitor-$VERSION-linux-x86_64.AppImage"
          jq -n --arg v "$APP_VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg arm "$BASE/$ARM" --rawfile armsig "files/$ARM.sig" \
            --arg intel "$BASE/$INTEL" --rawfile intelsig "files/$INTEL.sig" \
            --arg win "$BASE/$WIN" --rawfile winsig "files/$WIN.sig" \
            --arg linux "$BASE/$LINUX" --rawfile linuxsig "files/$LINUX.sig" \
            '{version: $v, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $arm, signature: $armsig},
              "darwin-x86_64": {url: $intel, signature: $intelsig},
              "windows-x86_64": {url: $win, signature: $winsig},
              "linux-x86_64": {url: $linux, signature: $linuxsig}}}' > files/latest.json
          jq '.platforms | keys' files/latest.json

      # 릴리스 본문은 저장소의 RELEASE_NOTES.md("## 한국어" · "## English" 두 칸의 "- " 목록)다. 앱의 업데이트 창이
      # 이 본문에서 자기 언어 칸의 목록만 읽어 "바뀐 점"으로 보여 준다. 설치 안내는 그 뒤 다른 칸에 붙여서 목록에
      # 섞이지 않게 한다. 버전 올리기(scripts/bump-release.sh)가 비었거나 지난 판 그대로인 파일을 막는다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: repo
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          {
            cat repo/RELEASE_NOTES.md
            printf '\n## Downloads\n\nmacOS (Apple silicon, Intel), Windows, Linux. The Windows installer is not code signed yet, so Windows shows a SmartScreen warning the first time.\n'
          } > body.md
          # Why: the homepage's download button links to releases/latest/download/<name>, which needs a name without
          # the version. The button picks the visitor's system, so Windows and Linux get fixed names as well. The
          # versioned files stay too, because the Homebrew cask and the updaters download those.
          cp "files/Monitor-$VERSION-mac-arm64.dmg" files/monitor-macos-arm64.dmg
          cp "files/Monitor-$VERSION-mac-x64.dmg" files/monitor-macos-x64.dmg
          cp "files/monitor-$VERSION-windows-x64-setup.exe" files/monitor-windows-x64-setup.exe
          cp "files/monitor-$VERSION-linux-x86_64.AppImage" files/monitor-linux-x86_64.AppImage
          cp "files/monitor-$VERSION-linux-amd64.deb" files/monitor-linux-amd64.deb
          cp "files/monitor-$VERSION-linux-x86_64.rpm" files/monitor-linux-x86_64.rpm
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Monitor $VERSION" \
            --notes-file body.md
