[package]
name = "monitor-native"
version = "2.6.1030+2"
description = "Monitor's one native module: system readings, the cleanup scan, quit / pause actions and the tray picture"
authors = ["RUNNERS-IM"]
license-file = "../LICENSE.md"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.0"
libc = "0.2"
# Why: draws the menu-bar bars picture at runtime, so the moving bars need no image files.
# Pinned to the same version as Remote so every RUNNERS app renders the shared frame with the same pixels.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
